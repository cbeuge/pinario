# pinario.de — kampagnengesteuertes Posten auf Social Media, Flask/gunicorn
# auf Port 3008. Ausgerollt am 03.09.2026.
#
# Auf dem Server liegt diese Datei als /etc/nginx/sites-available/pinario.
# Sie wird von hier kopiert, nicht dort bearbeitet:
#
#   cp /var/www/pinario/betrieb/nginx-pinario.conf \
#      /etc/nginx/sites-available/pinario
#   nginx -t && systemctl reload nginx
#
# Ausnahme sind die Zeilen, die certbot selbst einträgt (Zertifikat,
# Weiterleitung von 80 auf 443). Die stehen nur auf dem Server.
#
# **Nur pinario.de.** www.pinario.de und admin.pinario.de zeigen am
# 03.09.2026 noch auf All-Inkl (85.13.157.138). Ein server_name darauf würde
# hier nie erreicht, und certbot scheiterte daran: die Prüfung von Lets
# Encrypt landet dann bei All-Inkl statt hier. Sobald die Einträge umgebogen
# sind, kommt www dazu und das Zertifikat wird erweitert.

server {
    server_name pinario.de;

    # Muss zu MAX_CONTENT_LENGTH in app/config.py passen, sonst lehnt nginx
    # ab, bevor die Anwendung eine verständliche Meldung zeigen kann.
    client_max_body_size 64m;

    # Diese drei Kopfzeilen schickt die Anwendung selbst. Ohne das Verstecken
    # stünden sie doppelt in der Antwort, einmal mit dem Wert der Anwendung
    # und einmal mit dem des Snippets. Bei X-Frame-Options mit zwei
    # verschiedenen Werten ignorieren Browser im Zweifel beide — dann wäre
    # die Kopfzeile schlechter als gar keine.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    include snippets/sicherheit.conf;

    # Die Content-Security-Policy kommt aus der Anwendung und wird hier
    # bewusst *nicht* gesetzt: sie gehört zum Code und ändert sich mit ihm.
    # Wer hier eine zweite ergänzt, bekommt die Schnittmenge aus beiden, und
    # das fällt nicht als Fehler auf, sondern als Funktion, die nichts tut.

    # Ein Werkzeug für eine Person gehört in keinen Suchindex. Impressum und
    # Datenschutz sind ausgenommen: die Datenschutz-Adresse wird beim Anlegen
    # der Pinterest-App gebraucht, und ein Impressum soll auffindbar sein.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /impressum\nAllow: /datenschutz\nDisallow: /\n";
    }

    # Erzeugte und hochgeladene Bilder. Liegen außerhalb von /static, damit
    # sie nicht zusammen mit dem Code ausgeliefert werden. Pinterest holt
    # Bilder über eine öffentlich erreichbare Adresse, deshalb muss dieser
    # Ort von außen erreichbar sein.
    location /medien/ {
        alias /var/www/pinario/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP setzt nginx selbst, darauf verlässt sich die
        # Anmeldebremse in app/sicherheit.py.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
