# pinario.de — kampagnengesteuertes Posten auf Social Media, Flask/gunicorn
# auf Port 3008. Ausgerollt am 03.09.2026.
#
# Auf dem Server liegt diese Datei als /etc/nginx/sites-available/pinario.
# Sie wird von hier kopiert, nicht dort bearbeitet:
#
#   cp /var/www/pinario/betrieb/nginx-pinario.conf \
#      /etc/nginx/sites-available/pinario
#   nginx -t && systemctl reload nginx
#
# Ausnahme sind die Zeilen, die certbot selbst einträgt (Zertifikat,
# Weiterleitung von 80 auf 443). Die stehen nur auf dem Server.
#
# **www zeigt seit dem 03.09.2026 hierher** (vorher All-Inkl). Deshalb steht
# unten ein eigener Block, der www.pinario.de auf die Hauptadresse umleitet,
# und das Zertifikat deckt beide Namen ab. Ohne diesen Block landet
# www.pinario.de beim default_server und liefert ein fremdes Zertifikat aus —
# das sieht der Browser als Warnung, nicht als 404.
#
# **admin.pinario.de gibt es nicht mehr**, der DNS-Eintrag ist weg. Die
# Anwendung läuft bewusst auf der Hauptadresse.

server {
    server_name pinario.de;

    # Muss zu MAX_CONTENT_LENGTH in app/config.py passen, sonst lehnt nginx
    # ab, bevor die Anwendung eine verständliche Meldung zeigen kann.
    client_max_body_size 64m;

    # Diese drei Kopfzeilen schickt die Anwendung selbst. Ohne das Verstecken
    # stünden sie doppelt in der Antwort, einmal mit dem Wert der Anwendung
    # und einmal mit dem des Snippets. Bei X-Frame-Options mit zwei
    # verschiedenen Werten ignorieren Browser im Zweifel beide — dann wäre
    # die Kopfzeile schlechter als gar keine.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    include snippets/sicherheit.conf;

    # Die Content-Security-Policy kommt aus der Anwendung und wird hier
    # bewusst *nicht* gesetzt: sie gehört zum Code und ändert sich mit ihm.
    # Wer hier eine zweite ergänzt, bekommt die Schnittmenge aus beiden, und
    # das fällt nicht als Fehler auf, sondern als Funktion, die nichts tut.

    # Ein Werkzeug für eine Person gehört in keinen Suchindex. Impressum und
    # Datenschutz sind ausgenommen: die Datenschutz-Adresse wird beim Anlegen
    # der Pinterest-App gebraucht, und ein Impressum soll auffindbar sein.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /impressum\nAllow: /datenschutz\nDisallow: /\n";
    }

    # Erzeugte und hochgeladene Bilder. Liegen außerhalb von /static, damit
    # sie nicht zusammen mit dem Code ausgeliefert werden. Pinterest holt
    # Bilder über eine öffentlich erreichbare Adresse, deshalb muss dieser
    # Ort von außen erreichbar sein.
    location /medien/ {
        alias /var/www/pinario/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP setzt nginx selbst, darauf verlässt sich die
        # Anmeldebremse in app/sicherheit.py.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Varianten erzeugen dauert: ein Text rund 40 Sekunden, jedes Bild
        # noch einmal 20 bis 30, und bis zu acht Varianten auf einmal sind
        # erlaubt — zusammen also mehrere Minuten.
        #
        # **Der Standard sind 60 Sekunden**, und darin liegt die eigentliche
        # Falle: nginx bricht mit einem 504 ab, während gunicorn ruhig
        # weiterarbeitet und die Varianten fertig anlegt. Wer den 504 sieht,
        # hält den Vorgang für gescheitert und fängt von vorn an, obwohl
        # längst alles in der Datenbank steht. Genau das ist am 04.09.2026
        # passiert.
        #
        # Der Wert liegt bewusst **über** dem --timeout von gunicorn: wäre er
        # kleiner, gäbe nginx zuerst auf und der echte Fehler bliebe
        # unsichtbar.
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    listen 80;
    listen [::]:80;
}


# www auf die Hauptadresse. Ein eigener Block statt eines zweiten Namens im
# server_name oben: so gibt es die Seite unter genau einer Adresse, und was
# in Pinterest-Apps, Rechtstexten und Rückruf-Adressen steht, bleibt eindeutig.
#
# Auf dem Server steht dieser Block zweimal, einmal für 443 mit denselben
# ssl-Zeilen wie oben und einmal für 80. Sonst würde www zwar umleiten, aber
# der Browser käme vorher am fremden Zertifikat des default_server vorbei.
server {
    server_name www.pinario.de;
    return 301 https://pinario.de$request_uri;

    listen 80;
    listen [::]:80;
}
