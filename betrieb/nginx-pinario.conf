# /etc/nginx/sites-available/pinario
#
# Erst so anlegen (nur Port 80), dann
#   certbot --nginx -d pinario.de -d www.pinario.de
# Certbot trägt den 443-Block und die Weiterleitung selbst nach.

server {
    listen 80;
    listen [::]:80;
    server_name pinario.de www.pinario.de;

    # Hochgeladene und erzeugte Bilder gehen an nginx vorbei an Python
    # vorbei. Sie liegen bewusst außerhalb von /static, damit sie nicht
    # zusammen mit dem Code ausgeliefert werden.
    location /medien/ {
        alias /var/www/pinario/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        # X-Real-IP setzt nginx selbst, darauf verlässt sich die
        # Anmeldebremse in app/sicherheit.py.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Erzeugte Bilder und Videos können groß werden. Muss zu
    # MAX_CONTENT_LENGTH in app/config.py passen, sonst lehnt nginx ab,
    # bevor die App eine verständliche Meldung zeigen kann.
    client_max_body_size 64m;
}
